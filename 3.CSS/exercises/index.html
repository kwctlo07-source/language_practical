<!DOCTYPE html>

<html>

<head>
  <title>株式会社アールピーシー</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="layout">

    <header class="site-header">
      <h3 id="top">
      <span class="circle">R</span>
      RPCホーム
      </h3>
    </header>

    <aside class="sidebar">
      <div class="menu-trigger">
        <span class="menu-title">ジャンプ先</span>
        <div class="dropdown">
          <ul>
            <li><a href="#card" class="list">カード</a></li>
            <li><a href="#form" class="list">フォーム</a></li>
            <li><a href="#flexbox" class="list">FlexBox</a></li>
           <li> <a href="#respons" class="list">レスポンシブ</a></li>
          </ul>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="design">
      <h1>デザイン</h1>
        <div class="box-demo">
          <article class="box">
            <h3 class="ribbon" id="card">カード</h3>
            <p>margin / border / padding / shadow / radius / background / typography</p>
            <div class="cluster">
              <button class="btn">色のあるボタン</button>
              <button class="btn btn--ghost">色のないボタン</button>
              <button class="btn" disabled>無効ボタン</button>
            </div>
          </article>
        </div>
      </div>
      
      <div class="form">
          <h1 id="form">フォーム</h1>
            <h3 class="nametag">名前</h3>
              <input class="name" name="name" type="text" placeholder="アールピーシー　太郎" />
        
        <div class="gender">
          <h3>性別</h3>
            <label class="gender-radio"><input type="radio" name="gender" value="male" />男性</label>
            <label class="gender-radio"><input type="radio" name="gender" value="female" />女性</label>
            <label class="gender-radio"><input type="radio" name="gender" value="ext" />その他</label>
        </div>
        
        <div class="countory">
          <h3>都道府県</h3>
            <select name="prefecture" class="prefecture">
              <option value="" selected hidden>選択してください</option>
              <option value="1">北海道</option>
              <option value="2">青森県</option>
              <option value="3">岩手県</option>
              <option value="4">宮城県</option>
              <option value="5">秋田県</option>
              <option value="6">山形県</option>
              <option value="7">福島県</option>
              <option value="8">茨城県</option>
              <option value="9">栃木県</option>
              <option value="10">群馬県</option>
              <option value="11">埼玉県</option>
              <option value="12">千葉県</option>
              <option value="13">東京都</option>
              <option value="14">神奈川県</option>
              <option value="15">新潟県</option>
              <option value="16">富山県</option>
              <option value="17">石川県</option>
              <option value="18">福井県</option>
              <option value="19">山梨県</option>
              <option value="20">長野県</option>
              <option value="21">岐阜県</option>
              <option value="22">静岡県</option>
              <option value="23">愛知県</option>
              <option value="24">三重県</option>
              <option value="25">滋賀県</option>
              <option value="26">京都府</option>
              <option value="27">大阪府</option>
              <option value="28">兵庫県</option>
              <option value="29">奈良県</option>
              <option value="30">和歌山県</option>
              <option value="31">鳥取県</option>
              <option value="32">島根県</option>
              <option value="33">岡山県</option>
              <option value="34">広島県</option>
              <option value="35">山口県</option>
              <option value="36">徳島県</option>
              <option value="37">香川県</option>
              <option value="38">愛媛県</option>
              <option value="39">高知県</option>
              <option value="40">福岡県</option>
              <option value="41">佐賀県</option>
              <option value="42">長崎県</option>
              <option value="43">熊本県</option>
              <option value="44">大分県</option>
              <option value="45">宮崎県</option>
              <option value="46">鹿児島県</option>
              <option value="47">沖縄県</option>
            </select>
        </div>
        
        <div class="task">
          <h3>完了課題</h3>
            <label class="language"><input type="checkbox" name="language" value="HTML" />HTML</label>
              <label class="language"><input type="checkbox" name="language" value="CSS" />CSS</label>
              <label class="language"><input type="checkbox" name="language" value="JavaScript" />JavaScript</label>
        </div>
        
        <div class="freespace">
          <h3>自己紹介</h3>
            <textarea name="free" class="freebox" placeholder="自己紹介を入力"></textarea>
        </div>
        
      </div>
      
      <div class="flexbox">
        <h2 id="flexbox">FlexBox</h2>
          <div class="buttun">
            <button class="flexbox-tag">#css</button>
            <button class="flexbox-tag">#html</button>
            <button class="flexbox-tag">#javascript</button>
            <button class="flexbox-tag">#Flexbox</button>
            <button class="flexbox-tag">#Grid</button>
            <button class="flexbox-tag">#MediaQueries</button>
            <button class="flexbox-tag">#ContainerQueries</button>
          </div>
      </div>
      
      
      
      <h2 id="respons">カードレイアウトでレスポンシブ</h2>
      <div class="card">
        <div class="carditem">
          <h3>Card A</h3>
          <p>space-betweenで等間隔</p>
        </div>
        <div class="carditem">
        <h3>Card B</h3>
          <p>720pxで並び変化</p>
        </div>
        <div class="carditem">
        <h3>Card C</h3>
          <p>フォーカスで枠を強調</p>
        </div>
        <div class="carditem">
        <h3>Card D</h3>
          <p>影とまるでおしゃれに</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      ©RPC
      <div class="backtop">
        <a href="#top">ページ上部へ</a>
      <div>
    </footer>

  </div>
</body>

</html>
